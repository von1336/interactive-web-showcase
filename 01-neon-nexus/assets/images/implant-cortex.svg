<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="chipBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913"/>
      <stop offset="100%" stop-color="#0d182e"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#chipBg)"/>
  <!-- Circuit Traces -->
  <g stroke="#00f3ff" stroke-width="2" fill="none" opacity="0.7">
    <path d="M50 80 L180 80 L220 120 L380 120 L420 80 L550 80"/>
    <path d="M50 320 L180 320 L220 280 L380 280 L420 320 L550 320"/>
    <path d="M120 50 L120 160 L180 200 L180 350"/>
    <path d="M480 50 L480 160 L420 200 L420 350"/>
  </g>
  <!-- Microprocessor Core -->
  <rect x="230" y="130" width="140" height="140" fill="#04060b" stroke="#00f3ff" stroke-width="3" rx="8"/>
  <rect x="250" y="150" width="100" height="100" fill="#081020" stroke="#ff0055" stroke-width="2" rx="4"/>
  <circle cx="300" cy="200" r="28" fill="#00f3ff" fill-opacity="0.3" stroke="#00f3ff" stroke-width="2"/>
  <circle cx="300" cy="200" r="12" fill="#ff0055"/>
  <!-- Pins -->
  <g fill="#00f3ff">
    <rect x="250" y="120" width="8" height="10"/>
    <rect x="280" y="120" width="8" height="10"/>
    <rect x="310" y="120" width="8" height="10"/>
    <rect x="340" y="120" width="8" height="10"/>
    <rect x="250" y="270" width="8" height="10"/>
    <rect x="280" y="270" width="8" height="10"/>
    <rect x="310" y="270" width="8" height="10"/>
    <rect x="340" y="270" width="8" height="10"/>
  </g>
  <text x="300" y="360" text-anchor="middle" fill="#00f3ff" font-family="monospace" font-size="12" letter-spacing="3">SYNAPTIC OVERDRIVE // MK-VII</text>
</svg>