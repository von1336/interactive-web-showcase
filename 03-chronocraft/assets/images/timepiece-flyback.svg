<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="fbBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#181414"/>
      <stop offset="60%" stop-color="#0b0a0a"/>
      <stop offset="100%" stop-color="#040303"/>
    </radialGradient>

    <!-- Matte Black Ceramic Gradient -->
    <radialGradient id="ceramicCase" cx="40%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#3d4048"/>
      <stop offset="35%" stop-color="#24262c"/>
      <stop offset="70%" stop-color="#141518"/>
      <stop offset="100%" stop-color="#0a0b0d"/>
    </radialGradient>

    <!-- Brushed Titanium Screws -->
    <linearGradient id="tiScrew" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Carbon Fiber Dial Pattern -->
    <pattern id="carbonWeave" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#121316"/>
      <rect width="6" height="6" fill="#1b1d22"/>
      <rect x="6" y="6" width="6" height="6" fill="#1b1d22"/>
      <line x1="0" y1="0" x2="12" y2="12" stroke="#252830" stroke-width="0.8"/>
      <line x1="0" y1="6" x2="6" y2="12" stroke="#2a2d36" stroke-width="0.8"/>
      <line x1="6" y1="0" x2="12" y2="6" stroke="#2a2d36" stroke-width="0.8"/>
    </pattern>

    <!-- Luminescent Ice-Blue BGW9 Gradient -->
    <linearGradient id="lumi" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Racing Crimson Gradient -->
    <linearGradient id="racingRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff334b"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>

    <!-- Shadows -->
    <filter id="fbShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#000000" flood-opacity="0.95"/>
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#ef4444" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="700" height="500" fill="url(#fbBg)"/>

  <g transform="translate(350, 240)" filter="url(#fbShadow)">
    <!-- Chronograph Pushers (Titanium & Ceramic at 2 and 4 o'clock) -->
    <!-- Start/Stop Pusher at 2 -->
    <g transform="rotate(35)">
      <rect x="175" y="-12" width="22" height="24" rx="4" fill="url(#ceramicCase)" stroke="#ef4444" stroke-width="1.5"/>
      <rect x="180" y="-8" width="12" height="16" fill="#ef4444" rx="2"/>
    </g>
    <!-- Reset/Flyback Pusher at 4 -->
    <g transform="rotate(145)">
      <rect x="175" y="-12" width="22" height="24" rx="4" fill="url(#ceramicCase)" stroke="#64748b" stroke-width="1.5"/>
      <rect x="180" y="-8" width="12" height="16" fill="#334155" rx="2"/>
    </g>

    <!-- Screw-down Crown at 3 with Red Accent Ring -->
    <rect x="182" y="-20" width="18" height="40" rx="3" fill="url(#ceramicCase)" stroke="#475569" stroke-width="1"/>
    <line x1="187" y1="-18" x2="187" y2="18" stroke="#ef4444" stroke-width="2"/>
    <circle cx="198" cy="0" r="5" fill="#ef4444"/>

    <!-- Ceramic Case & Angular Lugs -->
    <path d="M-115,-180 L-138,-225 L-90,-230 L-75,-185 Z" fill="url(#ceramicCase)" stroke="#334155" stroke-width="1"/>
    <path d="M115,-180 L138,-225 L90,-230 L75,-185 Z" fill="url(#ceramicCase)" stroke="#334155" stroke-width="1"/>
    <path d="M-115,180 L-138,225 L-90,230 L-75,185 Z" fill="url(#ceramicCase)" stroke="#334155" stroke-width="1"/>
    <path d="M115,180 L138,225 L90,230 L75,185 Z" fill="url(#ceramicCase)" stroke="#334155" stroke-width="1"/>

    <!-- Integrated Rubber Strap with Tread -->
    <path d="M-90,-230 L90,-230 L80,-245 L-80,-245 Z" fill="#0d0e11"/>
    <path d="M-90,230 L90,230 L80,245 L-80,245 Z" fill="#0d0e11"/>

    <!-- Bezel: Octagonal Chamfered Satin Ceramic -->
    <circle cx="0" cy="0" r="186" fill="url(#ceramicCase)"/>
    <circle cx="0" cy="0" r="176" fill="#0a0a0c"/>
    <circle cx="0" cy="0" r="172" fill="#1b1d24" stroke="#334155" stroke-width="1.5"/>

    <!-- 6 H-Style Titanium Bezel Screws -->
    <g>
      <circle cx="0" cy="-172" r="5" fill="url(#tiScrew)"/>
      <line x1="-3" y1="-172" x2="3" y2="-172" stroke="#000" stroke-width="1.2"/>

      <circle cx="149" cy="-86" r="5" fill="url(#tiScrew)"/>
      <line x1="146" y1="-86" x2="152" y2="-86" stroke="#000" stroke-width="1.2"/>

      <circle cx="149" cy="86" r="5" fill="url(#tiScrew)"/>
      <line x1="146" y1="86" x2="152" y2="86" stroke="#000" stroke-width="1.2"/>

      <circle cx="0" cy="172" r="5" fill="url(#tiScrew)"/>
      <line x1="-3" y1="172" x2="3" y2="172" stroke="#000" stroke-width="1.2"/>

      <circle cx="-149" cy="86" r="5" fill="url(#tiScrew)"/>
      <line x1="-152" y1="86" x2="-146" y2="86" stroke="#000" stroke-width="1.2"/>

      <circle cx="-149" cy="-86" r="5" fill="url(#tiScrew)"/>
      <line x1="-152" y1="-86" x2="-146" y2="-86" stroke="#000" stroke-width="1.2"/>
    </g>

    <!-- Inner Tachymeter Bezel -->
    <circle cx="0" cy="0" r="162" fill="#0c0d10"/>
    <circle cx="0" cy="0" r="162" fill="none" stroke="#ef4444" stroke-width="1.5"/>
    <!-- Tachymeter numerals -->
    <text x="0" y="-153" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="5" font-weight="700">TACHYMÈTRE 500</text>
    <text x="145" y="0" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="5">120</text>
    <text x="0" y="157" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="5">80</text>
    <text x="-145" y="0" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="5">60</text>

    <!-- Dial: Carbon Fiber Composite -->
    <circle cx="0" cy="0" r="148" fill="url(#carbonWeave)"/>
    <circle cx="0" cy="0" r="148" fill="none" stroke="#334155" stroke-width="1"/>

    <!-- Chronograph Tri-Compax Sub-dials with Concentric Snailing -->
    <!-- 1. 30-Minute Counter at 3 o'clock -->
    <g transform="translate(56, 0)">
      <circle cx="0" cy="0" r="34" fill="#0d0f14" stroke="#475569" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="30" fill="none" stroke="#334155" stroke-width="0.8" stroke-dasharray="2 3"/>
      <text x="0" y="-21" text-anchor="middle" fill="#ef4444" font-family="sans-serif" font-size="6" font-weight="700">30</text>
      <text x="21" y="2" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="5">10</text>
      <text x="-21" y="2" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="5">20</text>
      <!-- Subdial hand in red -->
      <line x1="0" y1="0" x2="14" y2="-12" stroke="#ef4444" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="2.5" fill="#f87171"/>
    </g>

    <!-- 2. 12-Hour Counter at 6 o'clock -->
    <g transform="translate(0, 56)">
      <circle cx="0" cy="0" r="34" fill="#0d0f14" stroke="#475569" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="30" fill="none" stroke="#334155" stroke-width="0.8" stroke-dasharray="2 3"/>
      <text x="0" y="-21" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="6" font-weight="700">12</text>
      <text x="21" y="2" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="5">3</text>
      <text x="0" y="25" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="5">6</text>
      <text x="-21" y="2" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="5">9</text>
      <!-- Subdial hand in red -->
      <line x1="0" y1="0" x2="-8" y2="-16" stroke="#ef4444" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="2.5" fill="#f87171"/>
    </g>

    <!-- 3. Small Seconds at 9 o'clock -->
    <g transform="translate(-56, 0)">
      <circle cx="0" cy="0" r="34" fill="#0d0f14" stroke="#475569" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="30" fill="none" stroke="#334155" stroke-width="0.8" stroke-dasharray="2 3"/>
      <text x="0" y="-21" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="6" font-weight="700">60</text>
      <text x="21" y="2" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="5">20</text>
      <text x="-21" y="2" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="5">40</text>
      <!-- Subdial hand in white -->
      <line x1="0" y1="0" x2="16" y2="8" stroke="#f8fafc" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="2.5" fill="#38bdf8"/>
    </g>

    <!-- Date Window at 4:30 -->
    <g transform="translate(48, 48)">
      <rect x="-8" y="-6" width="16" height="12" fill="#0a0a0c" stroke="#ef4444" stroke-width="1" rx="1"/>
      <text x="0" y="3" text-anchor="middle" fill="#f8fafc" font-family="monospace" font-size="7" font-weight="700">28</text>
    </g>

    <!-- Applied Super-LumiNova BGW9 Hour Batons -->
    <g fill="url(#lumi)" stroke="#1e293b" stroke-width="0.8">
      <!-- 12 o'clock double index -->
      <rect x="-5" y="-144" width="4" height="15" rx="1"/>
      <rect x="1" y="-144" width="4" height="15" rx="1"/>
      <!-- 1, 2 -->
      <rect x="68" y="-126" width="4" height="13" rx="1" transform="rotate(30, 70, -120)"/>
      <rect x="116" y="-76" width="4" height="13" rx="1" transform="rotate(60, 118, -70)"/>
      <!-- 4, 5 -->
      <rect x="116" y="66" width="4" height="13" rx="1" transform="rotate(120, 118, 72)"/>
      <rect x="68" y="116" width="4" height="13" rx="1" transform="rotate(150, 70, 122)"/>
      <!-- 7, 8 -->
      <rect x="-72" y="116" width="4" height="13" rx="1" transform="rotate(-150, -70, 122)"/>
      <rect x="-120" y="66" width="4" height="13" rx="1" transform="rotate(-120, -118, 72)"/>
      <!-- 10, 11 -->
      <rect x="-120" y="-76" width="4" height="13" rx="1" transform="rotate(-60, -118, -70)"/>
      <rect x="-72" y="-126" width="4" height="13" rx="1" transform="rotate(-30, -70, -120)"/>
    </g>

    <!-- Brand Typography & Certifications -->
    <text x="0" y="-72" text-anchor="middle" fill="#f8fafc" font-family="'Cinzel', serif, 'Arial Black'" font-size="11" font-weight="800" letter-spacing="4">CHRONOCRAFT</text>
    <text x="0" y="-58" text-anchor="middle" fill="#ef4444" font-family="sans-serif" font-size="5.5" font-weight="700" letter-spacing="2">FLYBACK CHRONOGRAPH</text>
    <text x="0" y="-48" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="4.5" letter-spacing="1.5">CHRONOMETER COSC 300M</text>

    <!-- Luminescent Skeleton Dauphine Hands -->
    <!-- Hour Hand (pointing ~10:08) -->
    <g transform="rotate(-60)">
      <polygon points="-5,10 0,-68 5,10 0,6" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
      <polygon points="-2.5,2 0,-60 2.5,2 0,0" fill="url(#lumi)"/>
    </g>

    <!-- Minute Hand (pointing ~1:54) -->
    <g transform="rotate(54)">
      <polygon points="-4.5,12 0,-108 4.5,12 0,8" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
      <polygon points="-2,2 0,-98 2,2 0,0" fill="url(#lumi)"/>
    </g>

    <!-- Racing Crimson Central Flyback Seconds Hand -->
    <g transform="rotate(-18)">
      <line x1="0" y1="28" x2="0" y2="-138" stroke="url(#racingRed)" stroke-width="1.8"/>
      <!-- Arrow Tip -->
      <polygon points="-3,-134 0,-144 3,-134" fill="#ef4444"/>
      <!-- Counterweight Logo -->
      <circle cx="0" cy="16" r="4.5" fill="#ef4444"/>
      <circle cx="0" cy="16" r="2" fill="#1e293b"/>
    </g>

    <!-- Center Pinion Cap -->
    <circle cx="0" cy="0" r="6" fill="#475569" stroke="#94a3b8" stroke-width="1"/>
    <circle cx="0" cy="0" r="2.5" fill="#ef4444"/>

    <!-- Sapphire Crystal Beveled Reflection -->
    <path d="M-130,-90 A140,140 0 0,1 130,-90" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="6"/>
    <path d="M-100,-115 A140,140 0 0,1 80,-130" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="3"/>
  </g>

  <!-- Specimen Title Banner below watch -->
  <text x="350" y="475" text-anchor="middle" fill="#ef4444" font-family="'Cinzel', serif" font-size="12" letter-spacing="4">NOCTURNE CHRONOGRAPH FLYBACK // CERAMIC &amp; TITANIUM</text>
</svg>