<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <rect width="600" height="450" fill="#ff5376"/>
  <!-- Retro Robot Head Vector -->
  <g transform="translate(300, 200)">
    <rect x="-90" y="-70" width="200" height="160" rx="16" fill="#000"/>
    <rect x="-100" y="-80" width="200" height="160" rx="16" fill="#ffde59" stroke="#000" stroke-width="6"/>
    <!-- Eyes -->
    <rect x="-65" y="-40" width="45" height="35" fill="#000" rx="4"/>
    <rect x="20" y="-40" width="45" height="35" fill="#000" rx="4"/>
    <circle cx="-42" cy="-22" r="8" fill="#38bdf8"/>
    <circle cx="42" cy="-22" r="8" fill="#38bdf8"/>
    <!-- Antenna -->
    <line x1="0" y1="-80" x2="0" y2="-120" stroke="#000" stroke-width="6"/>
    <circle cx="0" cy="-125" r="14" fill="#38bdf8" stroke="#000" stroke-width="4"/>
    <!-- Mouth Grid -->
    <rect x="-50" y="25" width="100" height="25" fill="#000" rx="4"/>
    <line x1="-25" y1="25" x2="-25" y2="50" stroke="#ffde59" stroke-width="3"/>
    <line x1="0" y1="25" x2="0" y2="50" stroke="#ffde59" stroke-width="3"/>
    <line x1="25" y1="25" x2="25" y2="50" stroke="#ffde59" stroke-width="3"/>
  </g>
  <text x="300" y="380" text-anchor="middle" fill="#fff" font-family="'Archivo Black', sans-serif" font-size="20">SYNTHETIX AI ENGINE</text>
</svg>