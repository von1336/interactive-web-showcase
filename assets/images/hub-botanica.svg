<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgBotanica" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c1a14" />
      <stop offset="50%" stop-color="#14281f" />
      <stop offset="100%" stop-color="#0a1510" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>
  </defs>
  <rect width="700" height="450" fill="url(#bgBotanica)"/>
  <!-- Soft Glow Orbs -->
  <circle cx="350" cy="225" r="180" fill="#22c55e" fill-opacity="0.08" filter="blur(40px)"/>
  <circle cx="480" cy="160" r="120" fill="#d4af37" fill-opacity="0.08" filter="blur(30px)"/>
  <!-- Elegant Arch Frame -->
  <path d="M220 400 L220 200 A130 130 0 0 1 480 200 L480 400" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.7"/>
  <!-- Monstera Leaf Silhouette Vector -->
  <g transform="translate(350, 240) scale(0.9)" fill="none" stroke="#4ade80" stroke-width="2.5" stroke-linejoin="round">
    <path d="M0 -110 C-60 -80 -100 0 -80 70 C-60 120 0 140 0 140 C0 140 60 120 80 70 C100 0 60 -80 0 -110 Z" fill="#143324" fill-opacity="0.8"/>
    <line x1="0" y1="-100" x2="0" y2="130" stroke="url(#goldGrad)" stroke-width="3"/>
    <!-- Leaf slits -->
    <path d="M0 -40 C-30 -30 -65 -15 -75 10" stroke="#4ade80" stroke-width="2"/>
    <path d="M0 -10 C-35 0 -70 20 -70 50" stroke="#4ade80" stroke-width="2"/>
    <path d="M0 25 C-30 35 -60 60 -55 85" stroke="#4ade80" stroke-width="2"/>
    <path d="M0 -40 C30 -30 65 -15 75 10" stroke="#4ade80" stroke-width="2"/>
    <path d="M0 -10 C35 0 70 20 70 50" stroke="#4ade80" stroke-width="2"/>
    <path d="M0 25 C30 35 60 60 55 85" stroke="#4ade80" stroke-width="2"/>
  </g>
  <!-- Bioluminescent floating pollen dots -->
  <circle cx="280" cy="140" r="3.5" fill="#fef08a" opacity="0.8"/>
  <circle cx="430" cy="120" r="4" fill="#a7f3d0" opacity="0.7"/>
  <circle cx="210" cy="270" r="3" fill="#fef08a" opacity="0.6"/>
  <circle cx="490" cy="290" r="3.5" fill="#86efac" opacity="0.75"/>
  <circle cx="350" cy="80" r="2.5" fill="#fef08a" opacity="0.9"/>
  <!-- Editorial Typography -->
  <text x="350" y="70" text-anchor="middle" fill="#d4af37" font-family="serif" font-size="15" letter-spacing="6">LUMINA BOTANICA</text>
  <text x="350" y="425" text-anchor="middle" fill="#86efac" font-family="serif" font-style="italic" font-size="12" letter-spacing="3">BIOPHILIC LUXURY EDITORIAL 02</text>
</svg>