<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" width="100%" height="100%">
  <defs>
    <pattern id="dotPattern" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="3" fill="#121212" fill-opacity="0.15"/>
    </pattern>
  </defs>
  <!-- Pop Yellow Background -->
  <rect width="700" height="450" fill="#ffde59"/>
  <rect width="700" height="450" fill="url(#dotPattern)"/>
  <!-- Chunky Brutalist Shapes with Offset Shadows -->
  <!-- Shape 1: Hot Pink Block -->
  <rect x="75" y="85" width="220" height="130" fill="#000" rx="4"/>
  <rect x="70" y="80" width="220" height="130" fill="#ff5376" stroke="#000" stroke-width="4" rx="4"/>
  <text x="180" y="155" text-anchor="middle" fill="#fff" font-family="'Archivo Black', sans-serif" font-weight="900" font-size="34">RADICAL*</text>
  <!-- Shape 2: Cyan Starburst / Polygon -->
  <g transform="translate(510, 160)">
    <!-- Shadow -->
    <polygon points="0,-75 22,-25 75,-22 35,15 48,70 0,38 -48,70 -35,15 -75,-22 -22,-25" fill="#000"/>
    <polygon points="-5,-80 17,-30 70,-27 30,10 43,65 -5,33 -53,65 -40,10 -80,-27 -27,-30" fill="#38bdf8" stroke="#000" stroke-width="4"/>
    <text x="-5" y="5" text-anchor="middle" fill="#000" font-family="'Archivo Black', sans-serif" font-weight="900" font-size="16">100%</text>
    <text x="-5" y="24" text-anchor="middle" fill="#000" font-family="'Archivo Black', sans-serif" font-weight="900" font-size="12">LOUD</text>
  </g>
  <!-- Shape 3: Chunky White Capsule -->
  <rect x="185" y="265" width="340" height="110" fill="#000" rx="20"/>
  <rect x="180" y="260" width="340" height="110" fill="#fff" stroke="#000" stroke-width="5" rx="20"/>
  <text x="350" y="325" text-anchor="middle" fill="#000" font-family="'Archivo Black', sans-serif" font-size="28">NEOPOP* STUDIO 04</text>
  <text x="350" y="352" text-anchor="middle" fill="#ff5376" font-family="monospace" font-weight="bold" font-size="13">NO BORING TEMPLATES // RAW DIGITAL</text>
</svg>