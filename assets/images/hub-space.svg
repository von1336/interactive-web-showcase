<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSpace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02040a"/>
      <stop offset="50%" stop-color="#070c1e"/>
      <stop offset="100%" stop-color="#140728"/>
    </linearGradient>
    <radialGradient id="planetGlow" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="35%" stop-color="#0284c7"/>
      <stop offset="70%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <filter id="corona">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="700" height="450" fill="url(#bgSpace)"/>
  <!-- Starfield Dots -->
  <g fill="#fff">
    <circle cx="80" cy="50" r="1.5" opacity="0.8"/>
    <circle cx="160" cy="120" r="1" opacity="0.6"/>
    <circle cx="230" cy="40" r="2" opacity="0.9"/>
    <circle cx="310" cy="90" r="1" opacity="0.5"/>
    <circle cx="580" cy="70" r="2" opacity="0.9"/>
    <circle cx="640" cy="140" r="1.5" opacity="0.7"/>
    <circle cx="90" cy="380" r="1" opacity="0.6"/>
    <circle cx="180" cy="410" r="2" opacity="0.8"/>
    <circle cx="600" cy="390" r="1.5" opacity="0.8"/>
    <circle cx="520" cy="340" r="1" opacity="0.5"/>
    <circle cx="430" cy="40" r="1.5" opacity="0.7"/>
  </g>
  <!-- Constellation Lines -->
  <path d="M80 50 L160 120 L230 40 M580 70 L640 140" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1"/>
  <!-- Central Exoplanet Sphere with Coronal Pulse -->
  <circle cx="350" cy="225" r="110" fill="#38bdf8" fill-opacity="0.12" filter="url(#corona)"/>
  <circle cx="350" cy="225" r="95" fill="url(#planetGlow)"/>
  <!-- Orbital Rings -->
  <ellipse cx="350" cy="225" rx="180" ry="45" fill="none" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="2" transform="rotate(-18 350 225)"/>
  <ellipse cx="350" cy="225" rx="180" ry="45" fill="none" stroke="#a855f7" stroke-opacity="0.3" stroke-dasharray="6 8" stroke-width="1.5" transform="rotate(-18 350 225)"/>
  <circle cx="210" cy="260" r="8" fill="#f43f5e"/>
  <!-- Radar Scanner Reticle -->
  <circle cx="350" cy="225" r="140" fill="none" stroke="#38bdf8" stroke-opacity="0.25" stroke-dasharray="2 12"/>
  <line x1="350" y1="65" x2="350" y2="385" stroke="#38bdf8" stroke-opacity="0.2"/>
  <line x1="190" y1="225" x2="510" y2="225" stroke="#38bdf8" stroke-opacity="0.2"/>
  <!-- Telemetry HUD Text -->
  <text x="350" y="45" text-anchor="middle" fill="#38bdf8" font-family="'Syncopate', sans-serif" font-size="12" letter-spacing="4">ASTRONEX DEEP SPACE 05</text>
  <text x="350" y="420" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="10" letter-spacing="2">SECTOR: KEPLER-452B // INTERFEROMETRY ACTIVE</text>
</svg>