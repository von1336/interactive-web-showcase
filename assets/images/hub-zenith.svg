<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b14" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="aurora" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.6" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <circle cx="300" cy="175" r="160" fill="url(#glow)" filter="blur(40px)" opacity="0.35" />

  <!-- 3D Geometric Grid Waves -->
  <path d="M0 260 Q 150 200, 300 260 T 600 260" fill="none" stroke="url(#aurora)" stroke-width="3" opacity="0.7" />
  <path d="M0 290 Q 150 230, 300 290 T 600 290" fill="none" stroke="url(#aurora)" stroke-width="2" opacity="0.5" />

  <!-- Stylized 3D Avatar Figure -->
  <g transform="translate(300, 155)">
    <!-- Torso -->
    <rect x="-35" y="-10" width="70" height="80" rx="20" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5" />
    <!-- Chest Core -->
    <circle cx="0" cy="25" r="12" fill="#06b6d4" opacity="0.85" />
    <circle cx="0" cy="25" r="6" fill="#ffffff" />
    <!-- Head -->
    <rect x="-45" y="-85" width="90" height="65" rx="26" fill="#0f172a" stroke="#6366f1" stroke-width="3" />
    <!-- Visor -->
    <rect x="-32" y="-68" width="64" height="26" rx="13" fill="#0284c7" />
    <!-- Visor Eyes -->
    <circle cx="-14" cy="-55" r="4" fill="#38bdf8" />
    <circle cx="14" cy="-55" r="4" fill="#38bdf8" />
    <!-- Left Arm -->
    <path d="M-35 10 Q -65 30, -55 70" fill="none" stroke="#64748b" stroke-width="12" stroke-linecap="round" />
    <!-- Right Arm (Waving) -->
    <path d="M35 10 Q 75 -20, 65 -60" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" />
    <!-- Waving Hand -->
    <circle cx="65" cy="-65" r="9" fill="#ec4899" />
    <!-- Wave Motion Lines -->
    <path d="M80 -75 Q 90 -65, 80 -55" fill="none" stroke="#a5b4fc" stroke-width="3" stroke-linecap="round" />
    <path d="M88 -82 Q 100 -65, 88 -48" fill="none" stroke="#a5b4fc" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Title Badge -->
  <rect x="180" y="285" width="240" height="36" rx="18" fill="rgba(15, 23, 42, 0.85)" stroke="#6366f1" stroke-width="1.5" />
  <text x="300" y="308" text-anchor="middle" fill="#f8fafc" font-family="monospace" font-size="13" font-weight="bold" letter-spacing="2">06 // ZENITH 3D</text>
</svg>